<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="#FFFFFF" opacity="0.2" />

  <!-- Worker Icon - Larger for splash screen -->
  <g transform="translate(50, 50)">
    <!-- Hard Hat -->
    <path
      d="M50 30 C 45 30, 40 35, 40 40 L 40 43 L 60 43 L 60 40 C 60 35, 55 30, 50 30"
      fill="#FFFFFF"
    />

    <!-- Face -->
    <circle cx="50" cy="35" r="7" fill="#128C7E" />

    <!-- Body -->
    <path
      d="M30 65 C30 65 30 55 50 55 C70 55 70 65 70 65 L70 85 L30 85 Z"
      fill="#FFFFFF"
    />

    <!-- Tools -->
    <path
      d="M25 70 L35 70"
      stroke="#FFFFFF"
      strokeWidth="3"
      strokeLinecap="round"
    />
    <path
      d="M65 70 L75 70"
      stroke="#FFFFFF"
      strokeWidth="3"
      strokeLinecap="round"
    />
  </g>
</svg>
